<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mangalam Travel & Tours - Blogs</title>
    <!-- main style -->
    <link rel="stylesheet" href="libs/css/style.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
        integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9942a4',
                        secondary: '#450f20',
                        bgLight: '#f8f8ff',
                    },
                    fontFamily: {
                        sans: ['"Mukta"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="list-blog">
        <div class="page-header">
            <!-- <h1 class="page-title">List Category</h1> -->
        </div>
        <div class="table-options">
            <div class="list-toolbar">
                <div class="list-search">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search" placeholder="Search blogs..." />
                </div>
                <a href="./add-blog.html">
                    <button type="button" class="list-create-btn">
                        <i class="fas fa-plus"></i> Create Blog
                    </button>
                </a>
            </div>
        </div>
        <div class="content">
            <div class="table-container">
                <table id="blog-table">
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Blog Name</th>
                            <th scope="col">Date</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <ul id="pagination-demo" class="pagination-sm"></ul>
        </div>
    </main>
</body>
<!-- global jquery -->
<script src="https://cdn.ckeditor.com/ckeditor5/35.4.0/classic/ckeditor.js"></script>
<!-- global jquery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<!-- app js -->
<script type="module" src="src/app.js"></script>

</html>
