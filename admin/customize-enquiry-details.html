<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mangalam Travel & Tours - Customize Enquiry Details</title>
    <!-- main style -->
    <link rel="stylesheet" href="libs/css/style.css">
    
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
        integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9942a4',
                        secondary: '#450f20',
                        bgLight: '#f8f8ff',
                    },
                    fontFamily: {
                        sans: ['"Mukta"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
        integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
</head>

<body data-barba="wrapper">
    <main data-barba="container" data-barba-namespace="customize-enquiry-details">
        <div class="page-header">
            <h1 class="page-title"></h1>
        </div>
        <div class="content">
            <div class="form-feild">
                <form action="" id="notice_form">
                    <div class="form-group">
                        <div class="input-holder">
                            <label for="">Name</label>
                            <input type="text" disabled required id="name" placeholder="" />
                        </div>
                        <div class="input-holder">
                            <label for="">Email</label>
                            <input type="text" disabled required id="email" placeholder="" />
                        </div>
                        <div class="input-holder">
                            <label for="">Phone</label>
                            <input type="text" disabled required id="phone" placeholder="" />
                        </div>
                        <div class="input-holder customize-trip-field" id="adult-count-holder">
                            <label for="">Adult Count</label>
                            <input type="text" disabled required id="adult_count" placeholder="" />
                        </div>
                        <div class="input-holder customize-trip-field" id="children-count-holder">
                            <label for="">Children Count</label>
                            <input type="text" disabled required id="children_count" placeholder="" />
                        </div>
                        <div class="input-holder customize-trip-field" id="from-date-holder">
                            <label for="">From Date</label>
                            <input type="text" disabled required id="from_date" placeholder="" />
                        </div>
                        <div class="input-holder customize-trip-field" id="to-date-holder">
                            <label for="">To Date</label>
                            <input type="text" disabled required id="to_date" placeholder="" />
                        </div>
                        <div class="input-holder">
                            <label for="">Destination</label>
                            <input type="text" disabled required id="destination_name" placeholder="" />
                        </div>
                        <div class="input-holder other-location-field hidden" id="message-holder">
                            <label for="">Message</label>
                            <textarea disabled id="message" rows="3" placeholder=""></textarea>
                        </div>
                        <div class="input-holder customize-trip-field" id="hotel-type-holder">
                            <label for="">Hotel Type</label>
                            <input type="text" disabled required id="hotel_type" placeholder="" />
                        </div>
                        <div class="input-holder customize-trip-field" id="children-age-holder">
                            <label for="">Children Age</label>
                            <div class="age-wrap age"></div>
                        </div>
                        <div class="input-holder customize-trip-field" id="places-holder">
                            <label for="">Choosed Places</label>
                            <div class="age-wrap place"></div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
<!-- global jquery -->
<script src="https://cdn.ckeditor.com/ckeditor5/35.4.0/classic/ckeditor.js"></script>
<!-- global jquery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<!-- app js -->
<script type="module" src="src/app.js"></script>

</html>
