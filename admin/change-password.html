<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password</title>
    <!-- main style -->
    <link rel="stylesheet" href="libs/css/style.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9942a4',
                        secondary: '#450f20',
                        bgLight: '#f8f8ff',
                    },
                    fontFamily: {
                        sans: ['"Mukta"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" />
    <!-- Flaticon -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>

<body data-barba="wrapper" class="bg-gray-50">
    <main data-barba="container" data-barba-namespace="change-password">
        <div class="page-header mb-6">
            <h1 class="page-title text-2xl font-bold text-gray-800 hidden">Change Password</h1>
        </div>

        <div class="content px-4 py-8 mx-auto flex flex-col ">
            <div class="bg-white rounded-xl p-8 w-full border border-gray-100">
                <div class="mb-8 text-left flex items-center gap-4">
                    <div
                        class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-4 text-blue-600">
                        <i class="fi fi-rr-lock text-2xl"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Change Password</h2>
                        <p class="text-gray-500 text-sm mt-1">Update your account security</p>
                    </div>
                </div>

                <form id="change_password_form" class="space-y-6">
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label for="old_password" class="block text-sm font-medium text-gray-700 mb-2">Current
                                Password</label>
                            <div class="relative">
                                <input type="password" id="old_password" name="old_password" required
                                    autocomplete="current-password"
                                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors outline-none pr-10"
                                    placeholder="Enter current password">
                                <button type="button"
                                    class="toggle-password absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 !bg-transparent focus:outline-none"
                                    data-target="#old_password">
                                    <i class="far fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label for="new_password" class="block text-sm font-medium text-gray-700 mb-2">New
                                Password</label>
                            <div class="relative">
                                <input type="password" id="new_password" name="new_password" required
                                    autocomplete="new-password"
                                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors outline-none pr-10"
                                    placeholder="Enter new password">
                                <button type="button"
                                    class="toggle-password absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 !bg-transparent focus:outline-none"
                                    data-target="#new_password">
                                    <i class="far fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-2">Confirm
                                New
                                Password</label>
                            <div class="relative">
                                <input type="password" id="confirm_password" name="confirm_password" required
                                    autocomplete="new-password"
                                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-colors outline-none pr-10"
                                    placeholder="Confirm new password">
                                <button type="button"
                                    class="toggle-password absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 !bg-transparent focus:outline-none"
                                    data-target="#confirm_password">
                                    <i class="far fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="save_btn"
                            class="w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex items-center gap-2">
                            <span>Update Password</span>
                            <i class="fi fi-rr-arrow-right text-sm flex items-center justify-center"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

<!-- global jquery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<!-- app js -->
<script type="module" src="src/app.js"></script>

</html>
