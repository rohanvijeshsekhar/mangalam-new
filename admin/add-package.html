<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mangalam Travel & Tours - Add Package</title>
        <!-- main style -->
        <link rel="stylesheet" href="libs/css/style.css">
        
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
        integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9942a4',
                        secondary: '#450f20',
                        bgLight: '#f8f8ff',
                    },
                    fontFamily: {
                        sans: ['"Mukta"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
                integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU"
                crossorigin="anonymous">
</head>

<body data-barba="wrapper">
        <main data-barba="container" data-barba-namespace="add-package">
                <div class="page-header">
                        <h1 class="page-title"></h1>
                </div>
                <div class="content">
                        <div class="form-feild">
                                <form action="" id="package_form">
                                        <div class="form-group">
                                                <div class="input-holder">
                                                        <label for="">Select Destination</label>
                                                        <select required name="" id="destinations">
                                                        </select>
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Select Package Category</label>
                                                        <select required name="" id="package_category">
                                                                <option value="">Select Category</option>
                                                                <option value="curated_itineraries">Curated Itineraries
                                                                </option>
                                                                <option value="fixed_departures">Fixed Departures
                                                                </option>
                                                                <option value="honeymoon_packages">Honeymoon Packages
                                                                </option>
                                                        </select>
                                                </div>
                                                <div class="input-holder" id="fixed_date_holder" style="display: none;">
                                                        <label for="">Fixed Departure Date</label>
                                                        <input type="date" id="fixed_departure_date" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Enter Package Title</label>
                                                        <input required type="text" id="title" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Select Thumbnail Image</label>
                                                        <input type="file" id="image_card" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Select Package Images</label>
                                                        <input type="file" multiple id="images" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Enter Package Duration</label>
                                                        <input required type="text" id="duration" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Enter Hotel Type</label>
                                                        <input type="text" id="hotel_type" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Enter Total Activites</label>
                                                        <input type="text" id="activities" placeholder="" />
                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Cancellation</label>
                                                        <input type="text" id="cancellation" placeholder="" />

                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Transportation</label>
                                                        <input type="text" id="transportation" placeholder="" />

                                                </div>
                                                <div class="input-holder">
                                                        <label for="">Enter Amount</label>
                                                        <input required type="number" id="amount" placeholder=""
                                                                step="any" />
                                                </div>
                                                <div class="input-holder" style="width:100%">
                                                        <label for="">Enter Description</label>
                                                        <textarea name="" class="editor" id="description"></textarea>
                                                </div>
                                                <div class="input-holder" style="width: 100%;">
                                                        <label for="">Package Highlights</label>
                                                        <div class="multi-inputs" data-type="single"
                                                                id="pack_highlight">
                                                                <div class="multi">
                                                                        <input type="text" placeholder="" id=""
                                                                                placeholder="" />
                                                                </div>
                                                                <div class="add-item">ADD ITEM +</div>
                                                        </div>
                                                </div>
                                                <div class="input-holder" style="width: 100%;">
                                                        <label for="">Thinks to know</label>
                                                        <div class="multi-inputs" data-type="single"
                                                                id="thinks_to_know">
                                                                <div class="multi">
                                                                        <input type="text" placeholder="" id=""
                                                                                placeholder="" />
                                                                </div>
                                                                <div class="add-item">ADD ITEM +</div>
                                                        </div>
                                                </div>
                                                <div class="input-holder" style="width: calc(100% / 2 - 20px);">
                                                        <label for="">Package Includes</label>
                                                        <div class="multi-inputs" data-type="single" id="pack_includes">
                                                                <div class="multi">
                                                                        <input type="text" placeholder="" id=""
                                                                                placeholder="" />
                                                                </div>
                                                                <div class="add-item">ADD ITEM +</div>
                                                        </div>
                                                </div>
                                                <div class="input-holder" style="width: calc(100% / 2 - 20px);">
                                                        <label for="">Package Excludes</label>
                                                        <div class="multi-inputs" data-type="single" id="pack_excludes">
                                                                <div class="multi">
                                                                        <input type="text" placeholder="" id=""
                                                                                placeholder="" />
                                                                </div>
                                                                <div class="add-item">ADD ITEM +</div>
                                                        </div>
                                                </div>
                                                <div class="input-holder" style="width: 100%">
                                                        <label for="">Package Itineary</label>
                                                        <div class="multi-inputs" id="itineary" data-type="combo">
                                                                <div class="multi itineary"
                                                                        style="flex-direction: column;">
                                                                        <span>Enter Day 1 Itineary</span>
                                                                        <input type="text" placeholder="Title"
                                                                                class="title" placeholder="" />
                                                                        <input type="file" class="iteneary_image" />
                                                                        <textarea name="" class="firstItineary"
                                                                                style="margin-top: 10px;"></textarea>
                                                                </div>
                                                                <div class="add-item" data-type="Itineary">ADD ITEM +
                                                                </div>
                                                        </div>
                                                </div>
                                                <div class="input-holder" style="width: 100%">
                                                        <label for="">Frequently asked questions</label>
                                                        <div class="multi-inputs" id="faq" data-type="combo">
                                                                <div class="multi faq" style="flex-direction: column;">
                                                                        <span>Question 1</span>
                                                                        <input type="text" placeholder="Question"
                                                                                class="question_title" />
                                                                        <textarea name="" class=""
                                                                                style="margin-top: 10px;"></textarea>
                                                                </div>
                                                                <div class="add-item" data-type="FAQ">ADD MORE +</div>
                                                        </div>
                                                </div>
                                                <div class="input-holder" style="width: 100%;">
                                                        <label for="">Enter Meta-Tag ( optional )</label>
                                                        <textarea name="" id="meta" cols="30" rows="10"></textarea>
                                                </div>
                                        </div>
                                        <button id="save_btn" type="submit">Create &nbsp; <img
                                                        src="assets/icons/arrow-right.png" alt=""></button>
                                </form>
                        </div>
                </div>
        </main>
</body>
<!-- global jquery -->
<script src="https://cdn.ckeditor.com/ckeditor5/35.4.0/classic/ckeditor.js"></script>
<!-- global jquery -->
<script src="https://cdn.ckeditor.com/ckeditor5/35.4.0/classic/ckeditor.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<!-- app js -->
<script type="module" src="src/app.js"></script>

</html>
